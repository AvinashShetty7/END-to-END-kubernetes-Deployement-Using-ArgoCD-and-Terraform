name: MERN CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ci.yaml"


env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: avi03/frontendservice
  BACKEND_IMAGE: avi03/backendservice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: tag
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build  -t ${REGISTRY}/${FRONTEND_IMAGE}:${TAG} ./frontend

      - name: Build Backend Image
        run: |
          docker build -t ${REGISTRY}/${BACKEND_IMAGE}:${TAG} ./backend

      - name: Push Frontend Image
        run: |
          docker push ${REGISTRY}/${FRONTEND_IMAGE}:${TAG}

      - name: Push Backend Image
        run: |
          docker push ${REGISTRY}/${BACKEND_IMAGE}:${TAG}

      - name: Update Helm values.yaml
        run: |
          sed -i "s/tag:.*/tag: ${TAG}/" frontend/Helm/front-chart/values.yaml
          sed -i "s/tag:.*/tag: ${TAG}/" backend/Helm/back-chart/values.yaml

      - name: Commit Helm Update
        run: |
          git add frontend/Helm/front-chart/values.yaml
          git add backend/Helm/back-chart/values.yaml
          git commit -m "Update image tag to ${TAG}"
          git push




